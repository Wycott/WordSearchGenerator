name: .NET Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SOLUTION_FILE: WordSearchGen.sln

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore
      - name: Test
        run: dotnet test WordSearchGen.Tests/WordSearchGen.Tests.csproj --configuration Release --no-build --verbosity normal

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Run Semgrep
        run: semgrep scan --config p/csharp --error
